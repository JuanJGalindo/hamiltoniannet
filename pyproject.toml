[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hamiltoniannet"
version = "0.1.0"
description = "A modular framework for Hamiltonian Neural Networks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["hamiltonian", "neural-network", "physics", "symplectic", "scientific-ml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
kaggle = ["kaggle-benchmarks", "kaggle>=2.0"]
hgn   = ["torchvision"]
sno   = ["torch-harmonics"]
dev   = [
    "pytest>=7",
    "pytest-cov",
    "import-linter",
    "ruff",
    "mypy",
    "pre-commit",
    "marimo",
]
docs  = ["sphinx", "sphinx-rtd-theme", "myst-parser"]

[tool.hatch.build.targets.wheel]
packages = ["src/hnet"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "benchmarks/"]

[tool.ruff]
target-version = "py310"  # matches requires-python >=3.10 (CI matrix includes 3.10)
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "PT", "NPY", "RUF"]
ignore = [
    "N806", # Allow lowercase variables for phase-space coordinates (q, p, z)
    "N803", # Allow lowercase argument names to match physical notation
    "E741", # Allow single-letter l (pendulum length) per physical notation
    "N812", # Allow `import torch.nn.functional as F` (PyTorch convention)
]

[tool.ruff.lint.per-file-ignores]
# marimo cell idiom: a trailing bare expression is the cell's rendered output
# (B018); Greek symbols in UI labels follow physical notation (RUF001).
"examples/notebooks/*.py" = ["B018", "RUF001"]
# Greek symbols (σ, Δ) in labels and docstrings follow physical notation.
"benchmarks/**/*.py" = ["RUF001", "RUF002"]

[tool.ruff.lint.isort]
known-first-party = ["hnet"]
forced-separate = ["tests", "benchmarks"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
# numpy 2.x stubs use PEP 695 `type` alias syntax which requires Python 3.12
# grammar. Setting python_version = "3.12" lets mypy parse them correctly.
# Our source code contains no 3.12-only constructs, so this is safe.
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.importlinter]
root_packages = ["hnet"]

# Layers are listed from highest level to lowest level: a module may import
# from layers below it, never from layers above it.
[[tool.importlinter.contracts]]
name = "Strict dependency direction"
type  = "layers"
layers = [
    "hnet.visualization",
    "hnet.evaluation",
    "hnet.training",
    "hnet.systems | hnet.models | hnet.integrators | hnet.losses | hnet.data",
    "hnet.utils",
    "hnet._protocols",
]
