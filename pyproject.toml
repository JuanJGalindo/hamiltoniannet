[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hamiltoniannet"
version = "0.1.0"
description = "A modular framework for Hamiltonian Neural Networks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["hamiltonian", "neural-network", "physics", "symplectic", "scientific-ml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
kaggle = ["kaggle-benchmarks", "kaggle-cli"]
hgn   = ["torchvision"]
sno   = ["torch-harmonics"]
dev   = [
    "pytest>=7",
    "pytest-cov",
    "import-linter",
    "ruff",
    "mypy",
    "pre-commit",
]
docs  = ["sphinx", "sphinx-rtd-theme", "myst-parser"]

[tool.hatch.build.targets.wheel]
packages = ["src/hnet"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "benchmarks/"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.importlinter]
root_packages = ["hnet"]

[[tool.importlinter.contracts]]
name = "Strict dependency direction"
type  = "layers"
layers = [
    "hnet._protocols",
    "hnet.utils",
    "hnet.systems | hnet.models | hnet.integrators | hnet.losses | hnet.data",
    "hnet.training",
    "hnet.evaluation",
    "hnet.visualization",
    "hnet.benchmarks",
]
